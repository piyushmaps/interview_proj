services:
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      # Local development only: the demo security plugin forces TLS and a
      # password policy that add nothing on a laptop. Never do this in a
      # deployed cluster — there, enable security and use real credentials.
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - VECTOR_STORE=opensearch
      - OPENSEARCH_HOST=opensearch
    depends_on:
      opensearch:
        condition: service_healthy
    volumes:
      - ../data/index:/app/data/index
      - ../data/sample:/app/data/sample
    restart: unless-stopped

volumes:
  opensearch-data:
