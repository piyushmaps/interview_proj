[project]
name = "intuit-agentic-rag"
version = "0.1.0"
description = "Agentic RAG knowledge assistant over multi-source capability docs (Jira, Slack, DevPortal, City Map)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "langchain-openai>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=0.2.0",
    "faiss-cpu>=1.9.0",
    "opensearch-py>=2.7.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.8.0",
    "numpy>=1.26.0",
    "pypdf>=5.0.0",
    "beautifulsoup4>=4.12.0",
    "langfuse>=3.0.0",
]

[project.optional-dependencies]
aws = [
    "boto3>=1.35.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.7.0",
    "httpx>=0.27.0",
    "fpdf2>=2.8.0",
]

[project.scripts]
ingest = "src.ingestion.pipeline:main"
serve = "src.api.main:run"
evaluate = "src.eval.harness:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"
